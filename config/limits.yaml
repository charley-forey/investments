mode: paper
position:
  max_position_pct: 15
  max_position_usd: 15000
  max_open_positions: 8
  risk_per_trade_pct: 1
orders:
  # Must move in lockstep with position.max_position_* — this is an independent
  # cap (engine.py "max_order_notional") and binds first if left behind.
  max_order_notional_usd: 15000
  max_new_trades_per_day: 10
  max_new_trades_per_week: 25
  allow_market_orders: false
  stale_order_ttl_minutes: 30
  bracket_default_target_r: 2
  # Risk two dollars to make one and no win rate saves you: at the observed 45%,
  # break-even is R=1.22. Baseline median was 0.48.
  # 1.5 -> 2.5, confirmed OUT OF SAMPLE by walk-forward (10 symbols x 4 sequential
  # folds): mean OOS R goes +0.119 -> +0.195 and positive folds 60% -> 75%. At 1.5
  # only 5/10 symbols passed the gate and folds sat exactly on the 60% threshold.
  # 3.0 tested better still (+0.230R, 85%) but is not adopted: the backtest applies
  # this ratio to a mechanical 2% daily stop, while live stops are agent-chosen and
  # 1-2% intraday, where R=3 means demanding a 3.6% move from a name whose ATR is
  # 2.5%. See docs/backtest_reward_risk_2026-07-27.md.
  min_reward_risk: 2.5
loss_kill_switch:
  max_daily_loss_pct: 3
  requires_manual_reset: true
symbols:
  min_price: 5
  min_avg_daily_volume: 500000
  blocklist: []
  allow_leveraged_etfs: false
options:
  defined_risk_only: true
  # Sole lever on contract count: contracts = floor(this / per_contract_loss).
  # NB one max-loss trade is 2.5% of equity vs the 3% daily kill switch.
  max_loss_per_trade_usd: 2500
  min_days_to_expiry: 7
  max_contracts_per_order: 100
pdt:
  enforce: true
  equity_threshold_usd: 25000
  max_day_trades_per_5_days: 3
wash_sale:
  enforce: true
  window_days: 30
  mode: block
cost_hurdle:
  enforce: true
  min_edge_multiple: 2
  option_fee_per_contract_usd: 0.05
  slippage_bps: 5
live:
  approval_required: true
  auto_submit_below_usd: 0
lifecycle:
  paper_to_live_min_trades: 30
  paper_to_live_min_expectancy: 0
  demote_after_losing_weeks: 2
portfolio:
  max_gross_exposure_pct: 100
  max_positions_per_underlying: 2
  drawdown_circuit_pct: 15
  elevated_vol_gross_scale: 0.5
  max_position_correlation: 0.9
  vol_target_annual: 0.15
  kelly_cap: 0.25
  max_net_delta_pct: 100
reconciliation:
  halt_on_mismatch: true
  tolerance_shares: 1
exits:
  stop_loss_pct: 8
  # Was 25. Off, to match what was actually measured: the winning backtest arm is
  # "trail, no target". A surviving +25% cap would silently reimpose the ceiling
  # the trail exists to remove, just further out.
  take_profit_pct: null
  # Was null, and inert even when set (nothing populated ExitRules.high_water).
  # Now wired, and it REPLACES the resting take-profit leg — the two cannot coexist,
  # the nearer target always fires first and the trail never runs.
  # 1,280 trades, 9y, 10 symbols, 40 walk-forward windows:
  #   fixed 2.5R target  +0.197 mean OOS R, 72% positive folds, worst -0.325
  #   trail 6%           +0.404 mean OOS R, 85% positive folds, worst -0.386
  #   trail 8%           +0.459 mean OOS R, 80% positive folds, worst -0.279  <-
  # 8% wins on mean R and on the worst fold. Unlike target_r this is measured off
  # the peak price, not off the stop distance, so the "live stops are 1-2%, the
  # backtest's are 2%" caveat that capped min_reward_risk at 2.5 does not apply.
  # See docs/backtest_trailing_exit_2026-07-28.md.
  trailing_pct: 8
  max_holding_days: null
  option_roll_dte: 7
# Passive long core: the book's DEFAULT STATE, not a signal.
# 40,212 backtested trades say no strategy beats an exposure-matched passive hold,
# and the first 8 live days cost $63 of compute to realise $83 gross while flat.
# Held deterministically (no LLM), regime-scaled, rebalanced only on a band.
core_position:
  enabled: true
  symbol: SPY
  # 40% at full weight. Regime scales it: up 1.0, sideways 0.6, down 0.25.
  # At today's sideways/calm that is ~24% of equity.
  target_pct: 40
  # Drift, as % of equity, before a rebalance is worth its friction.
  rebalance_band_pct: 5
  # The core must never crowd out the overlay it exists to complement.
  max_share_of_gross_pct: 50
events:
  # Block a NEW STOCK entry within this many days of a binary event (FOMC/CPI/NFP/
  # PCE/GDP, or the name's own earnings). Exits and defined-risk verticals are never
  # blocked. 2 covers "opened today, prints tomorrow" — the 7/28 CRM case.
  block_stock_entry_within_days: 2
