schedule:
  timezone: America/New_York
  premarket_research: 08:30
  # How often the daemon DRAINS the wake queue, not how often it calls the LLM —
  # the cost gate decides that, and a skipped cycle is pure Python plus one SQLite
  # read. At 15 the tick stream's sub-second detection still waited up to 15
  # minutes for a reaction, which wasted the whole point of it.
  intraday_scan_every_minutes: 1
  postclose_review: '16:30'
  weekend_research_day: sat
  weekend_research_time: '10:00'
  intel_every_minutes: 10
  movers_every_minutes: 15
tax:
  federal_short_term_rate: 0.24
  federal_long_term_rate: 0.15
  state_rate: 0.05
# `paths:` is deliberately absent — the Paths defaults are repo-relative and get
# resolved against the project root at load. Pinning them here writes one machine's
# layout into the file, which is how absolute Windows paths reached a Linux
# container and became filenames under the volume root.
agents:
  model: gpt-5.6-terra
  max_tokens: 16000
  max_proposals_per_cycle: 2
  max_proposals_intraday: 1
  max_tool_iterations: 25
  max_tool_iterations_intraday: 12
  bars_lookback_days: 60
  news_limit: 15
  options_chain_strikes: 8
  options_chain_max_dte: 60
  intraday_timeframe: 5Min
  opening_range_bars: 6
  calendar_horizon_days: 14
  strategy_model: null
  risk_model: null
  # Cheap tier: scoring + intel. Measured on the real digest 2026-07-31 --
  # luna $0.0258 vs haiku-4.5 $0.0672 for the same job, with web search working.
  scoring_model: gpt-5.6-luna
  redteam_model: null
  # A gpt-* id here routes that cycle to OpenAI; anything else goes to Anthropic.
  # The model id is the entire switch -- no other flag, and the loop, guardrails
  # and journal are identical either way.
  #
  # Measured 2026-07-31 on identical live sessions:
  #   agent loop   gpt-5.6-terra $0.0186  vs opus-4.8 $0.0924  (5.0x cheaper)
  #   risk review  gpt-5.6-terra $0.0397  vs opus-4.8 $0.1537  (3.9x)
  # and 2026-07-30's real volumes repriced: luna $0.54, terra $5.44, sol $13.60
  # against opus-4.8's $13.74. Most of that gap is the cache write premium
  # ($7.61 of that day), which OpenAI does not charge.
  #
  # Switched to OpenAI 2026-07-31. terra for every decision cycle; luna is the
  # cheap tier below (scoring + intel). Projected ~$5/day against $14.03 actual on
  # 07-30, i.e. inside the $6-7 target for the first time.
  #
  # Drop intraday to gpt-5.6-luna for roughly $1/day if cost matters more than
  # decision quality on the highest-volume cycle -- but that is the cheap tier
  # making the trading decisions, and this codebase has twice found a cheaper
  # model more expensive per decision. Watch expectancy, not just spend.
  model_by_cycle:
    intraday: gpt-5.6-terra
    premarket: gpt-5.6-terra
    postclose: gpt-5.6-terra
    weekend: gpt-5.6-terra
  effort: null
  effort_by_cycle:
    intraday: low
    premarket: high
    postclose: medium
    weekend: high
  effort_by_role:
    risk: high
    redteam: high
  trigger_gate_enabled: true
  redteam_confidence_threshold: 0.7
  max_daily_cost_usd: 15
  auto_calibrate_enabled: true
  auto_calibrate_dry_run: true
  auto_calibrate_min_outcomes: 30
  tools:
    strategy:
    - all
    - web_search
    risk:
    - get_account_state
    - get_quote
    - get_bars
    - get_options_chain
    - search_news
    - get_calendar
    - get_market_context
    - get_features
    - get_intraday_features
    - read_journal
    - get_market_intel
    - recall_similar
    - scan_universe
    - get_fundamentals
    - get_open_orders
    redteam:
    - same_as: risk
    scoring:
    - read_journal
    - read_memory
    - read_playbook
    - get_bars
    - get_market_context
    - recall_similar
    intel:
    - web_search
  web_search_max_uses:
    strategy: 3
    intel: 5
    risk: 0
    redteam: 0
    scoring: 0
# sip = consolidated tape (all US exchanges). Requires Algo Trader Plus, which is
# active. IEX was ~2% of volume and quoted one-sided books that the risk agent
# correctly read as "do not enter" — see broker/alpaca.py.
data_feed: sip
