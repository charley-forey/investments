[project]
name = "trading"
version = "0.1.0"
description = "Agentic AI trading system: multi-agent research/strategy/risk loop with a deterministic guardrail engine over Alpaca"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.33",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
sentiment = [
    "praw>=7.7",
]
embeddings = [
    "openai>=1.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
trading = "trading.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `backtest` lives at the repo root, not under src/. It was therefore never
# installed, so the nightly sweep died on `ModuleNotFoundError: No module named
# 'backtest'` every night at 17:35 while the scheduler logged "executed
# successfully". It passed under pytest and `python -m` only because those run
# with the repo root on sys.path; the daemon runs as the `trading` console
# script, which does not.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["trading*", "backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
